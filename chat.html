<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>聊天框制作 · Collage</title><link rel="stylesheet" href="css/chat.css">
</head>
<body data-view="preview">
<header class="island top">
  <div class="brand"><a href="index.html" aria-label="返回拼图工具" title="返回拼图工具">‹</a><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v12H9l-5 4z"/><path d="M8 8h8M8 11h5"/></svg><h1>聊天框制作</h1></div>
  <nav id="platformTabs" aria-label="平台样式"></nav>
  <label class="native">平台样式<select id="platform"><option value="wechat">微信</option><option value="douyin">抖音</option><option value="red">小红书</option><option value="ins">Instagram</option><option value="threads">Threads</option></select></label>
  <button id="save">导出 PNG ↓</button>
</header>
<main>
  <aside class="island inspector" id="settings"><h2>画面设置</h2>
    <section class="card"><h3>画面范围</h3><div class="segment" id="layoutTabs"></div>
    <label class="native">画面范围<select id="layout"><option value="full">完整聊天界面（含顶栏和图标）</option><option value="messages">纯聊天框</option></select></label>
    <label id="clockLabel">顶部状态栏时间<input id="clock" type="time" value="14:18" required></label>
    <label id="handleLabel" hidden>Instagram 用户名<input id="handle" maxlength="32"></label>
    <label id="groupLabel">微信群名（单聊留空）<input id="group" maxlength="40"></label></section>
    <fieldset id="wall" class="card"><legend>聊天背景</legend><label class="upload">选择或更换图片<input id="wallFile" type="file" accept="image/*"></label><button id="resetWall">恢复默认</button></fieldset>
    <h3>聊天双方</h3><div id="people"></div>
  </aside>
  <section class="stage" aria-label="实时预览">
    <div class="viewport"><figure><figcaption id="dimensions"></figcaption><canvas id="preview" aria-label="聊天记录图片预览"></canvas></figure></div>
    <div class="zoom island" aria-label="预览缩放"><button id="smaller" aria-label="缩小预览">−</button><output id="scale"></output><button id="larger" aria-label="放大预览">＋</button><button id="fit">适应屏幕</button></div>
  </section>
  <aside class="island dock" id="conversation"><div class="dock-head"><h2>对话内容</h2><button id="collapse" aria-expanded="true" aria-controls="dockContent" title="收起对话栏" aria-label="收起对话栏">›</button></div>
    <div id="dockContent"><div class="actions"><button id="add">＋ 文字</button><button id="voice">＋ 语音</button><button id="media">＋ 图片卡片</button><button id="date">＋ 时间标签</button></div><div id="messages"></div></div>
  </aside>
</main>
<p id="notice" role="status"></p>
<nav class="mobile island" aria-label="编辑视图"><button data-view="settings">设置</button><button data-view="preview">预览</button><button data-view="conversation">对话</button></nav>
<template id="person"><fieldset><legend></legend><label>昵称<input type="text" maxlength="32"></label><label>头像<input type="file" accept="image/*"></label></fieldset></template>
<template id="message"><div class="row"><select aria-label="发送方"><option value="peer">对方</option><option value="me">我</option></select><textarea rows="2" maxlength="600" aria-label="消息文字"></textarea><button aria-label="删除这条消息">删除</button></div></template><script src="js/chat-controls.js"></script><script src="js/chat.js"></script><script src="js/chat-studio.js"></script></body></html>
